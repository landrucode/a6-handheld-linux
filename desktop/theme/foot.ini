# Foot terminal configuration for the A6 handheld desktop (pastel theme).
# Colours follow desktop/theme/palette.sh.

[main]
font=JetBrains Mono:size=14
pad=8x8

[cursor]
style=beam
blink=no

[mouse]
hide-when-typing=yes

[colors-dark]
cursor=26242e c9b6f2
background=26242e
foreground=ece6f2
selection-background=3e3a4c
selection-foreground=ece6f2

# black, red, green, yellow, blue, magenta, cyan, white
