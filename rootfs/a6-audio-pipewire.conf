# Candidate-specific PCM nodes. A capture open failure is nonfatal.
context.properties = {
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 48000 44100 ]
    default.clock.quantum = 256
    default.clock.min-quantum = 128
}
context.objects = [
    { factory = adapter
      args = {
        factory.name = api.alsa.pcm.sink
        node.name = a6-speaker
        node.description = "N42 Speaker"
        media.class = "Audio/Sink"
        api.alsa.path = "hw:N42,0"
        api.alsa.period-size = 128
        api.alsa.headroom = 128
        api.alsa.soft-mixer = true
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 1
        audio.position = [ MONO ]
      }
    }
    { factory = adapter
      args = {
        factory.name = api.alsa.pcm.source
        api.alsa.disable-mmap = true
        node.name = a6-microphone
        node.description = "N42 Microphone"
        media.class = "Audio/Source"
        api.alsa.path = "hw:N42,0"
        api.alsa.period-size = 128
        api.alsa.headroom = 128
        audio.format = "S16LE"
        audio.rate = 44100
        audio.channels = 1
        audio.position = [ MONO ]
      }
      flags = [ nofail ]
    }
]
