# RAM-only, outbound NTS client. USB supplies the initial TLS-valid clock.
server time.cloudflare.com iburst nts
authselectmode require
nosystemcert
ntstrustedcerts /tmp/a6-time-runtime/ca-bundle.pem
port 0
cmdport 0
bindcmdaddress /tmp/a6-time/chronyd.sock
pidfile /tmp/a6-time/chronyd.pid
driftfile /tmp/a6-time/drift
ntsdumpdir /tmp/a6-time/nts
logdir /tmp/a6-time
log tracking measurements statistics
makestep 1.0 3
